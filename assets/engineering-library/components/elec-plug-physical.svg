<svg xmlns="http://www.w3.org/2000/svg" width="35mm" height="35mm" viewBox="0 0 160 160" role="img" aria-labelledby="elec-plug-physical-title elec-plug-physical-desc"><title id="elec-plug-physical-title">Two-blade plug — proposed drafting variant</title><desc id="elec-plug-physical-desc">Generic two-blade plug with a flanged molded body, shallow top face and cable neck. Blade count and cable edges match the baseline; no fit, voltage, rating or standard conformity is claimed.</desc><g id="artwork" fill="none" stroke="#303030" stroke-linecap="butt" stroke-linejoin="round"><path d="M20 60 H47 V67 H20 Z M20 93 H47 V100 H20 Z" fill="white" stroke-width="1.8" /><path d="M47 50 L55 42 H63 V45 C81 45 97 47 110 57 L110 65 H102 C89 55 73 53 55 53 V50 Z" fill="white" stroke-width="1.8" /><path d="M47 50 H55 V53 C73 53 89 55 102 65 H110 V95 H102 C89 105 73 107 55 107 V110 H47 Z" fill="white" stroke-width="1.8" /><path d="M110 67 H125 V93 H110 Z" fill="white" stroke-width="1.8" /><path d="M115 68 V92 M120 68 V92 M125 75 H142 M125 85 H142" stroke-width="1.05" /></g><g id="surface-tone" fill="none" stroke="#858585" stroke-width="0.65"><path d="M60 100 C75 99 89 95 98 91 M60 103 C75 102 89 98 98 94" /></g></svg>