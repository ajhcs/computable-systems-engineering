<title id="title">Regulator — proposed side elevation</title><desc id="desc">Generic adjustable diaphragm regulator with two opposed connection ends and a bottom plug interpretation. The diaphragm is enclosed and not drawn. The plug is a proposed interpretation of an ambiguous baseline mark.</desc>
