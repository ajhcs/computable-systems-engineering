<svg xmlns="http://www.w3.org/2000/svg" width="35mm" height="35mm" viewBox="0 0 160 160" role="img" aria-labelledby="mech-actuator-title mech-actuator-desc"><title id="mech-actuator-title">Linear actuator — proposed drafting variant</title><desc id="mech-actuator-desc">A generic axial linear-actuator body and extending output rod; its single rear face mark and two longitudinal marks remain. Power source, control, stroke and force are unspecified.</desc><g id="artwork" fill="none" stroke="#303030" stroke-linecap="butt" stroke-linejoin="round"><path d="M30 56 L42 48 L102 54 L102 95 L90 103 L30 97 Z" fill="white" stroke-width="1.8" /><path d="M30 56 L90 62 L102 54 M90 62 V103" stroke-width="1.8" /><path d="M102 67 H111 A5.5 13 0 0 1 111 93 H102 A5.5 13 0 0 1 102 67 Z" fill="white" stroke-width="1.8" /><ellipse cx="111" cy="80" rx="5.5" ry="13" fill="white" stroke-width="1.05" /><path d="M111 74 H137 A2.5 6 0 0 1 137 86 H111 A2.5 6 0 0 1 111 74 Z" fill="white" stroke-width="1.8" /><ellipse cx="137" cy="80" rx="2.5" ry="6" stroke-width="1.05" /><ellipse cx="40" cy="77.5" rx="4.2" ry="4" stroke-width="1.05" /><path d="M50 68 L80 71 M50 91 L80 94" stroke-width="1.05" /></g><g id="surface-tone" fill="none" stroke="#858585" stroke-width="0.65"><path d="M93 65 V98 M97 62 V95" /></g></svg>