<svg xmlns="http://www.w3.org/2000/svg" width="35mm" height="35mm" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Optical microscope — side elevation</title>
  <desc id="desc">Generic optical microscope in side elevation: an inclined single eyepiece tube enters the head; the nosepiece carries objectives above the stage; a bracket joins the stage to the curved stand, which meets the base. A focus knob is mounted on the stand. Magnification, dimensions and clinical use are unspecified.</desc>
