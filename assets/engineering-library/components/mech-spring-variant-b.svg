<title id="title">Spring B — three-turn wire boundary</title><desc id="desc">Generic open-ended projected compression helix with 3 illustrative turns. A constant-width projected wire boundary with near-over-far crossing order; it is not an exact swept-round-wire CAD silhouette. No dimensions, wire size or performance are specified.</desc>
