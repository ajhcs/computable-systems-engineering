<title id="mech-moment-title">Moment of force</title>
<desc id="mech-moment-desc">A rightward moment arm and upward force illustrate a counterclockwise positive moment about the pivot. The sign convention is local to this view; no force, length or calculated moment is given. Torque is also a moment.</desc>
