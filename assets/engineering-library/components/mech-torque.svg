<title id="mech-torque-title">Torque</title>
<desc id="mech-torque-desc">A curved arrow around a shaft face indicates a torque; plus is counterclockwise as viewed. Illustrative sign choice; torque is a moment, and magnitude, axis convention and rotation are unspecified.</desc>
