<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="35mm" height="35mm" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Flanged shaft coupling — parallel oblique exterior</title>
  <desc id="desc">Two coaxial shaft ends enter opposed hubs and flanges. The flanges meet at a visible seam. Two bolt heads on the near flange face indicate the fastened joint. Bolt count, shaft fit, dimensions and capacity are not specified.</desc>
  <g id="artwork" fill="none" stroke="#282828" stroke-linecap="round" stroke-linejoin="round">
    <g transform="rotate(-14 80 80)">
      <path data-part="axis" d="M5 80 H155" stroke-width="0.7" stroke-dasharray="7 2 1.4 2" />
      <path data-part="left-shaft" d="M16 72 H45 A3.36 8 0 0 1 45 88 H16 A3.36 8 0 0 1 16 72 Z" fill="white" stroke-width="1.8" />
      <path data-part="left-hub" d="M42 65 H62 A6.3 15 0 0 1 62 95 H42 A6.3 15 0 0 1 42 65 Z" fill="white" stroke-width="1.8" />
      <path data-part="left-flange" d="M61 53 H72 A11.34 27 0 0 1 72 107 H61 A11.34 27 0 0 1 61 53 Z" fill="white" stroke-width="1.8" />
      <path data-part="right-flange" d="M72 53 H86 A11.34 27 0 0 1 86 107 H72 A11.34 27 0 0 1 72 53 Z" fill="white" stroke-width="1.8" />
      <ellipse data-part="near-flange-face" cx="86" cy="80" rx="11.34" ry="27" fill="white" stroke-width="1.05" />
      <path data-part="upper-bolt-head" d="M85 55 H88.5 A1.68 4 0 0 1 88.5 63 H85 A1.68 4 0 0 1 85 55 Z" fill="white" stroke-width="1.05" />
      <path data-part="lower-bolt-head" d="M85 97 H88.5 A1.68 4 0 0 1 88.5 105 H85 A1.68 4 0 0 1 85 97 Z" fill="white" stroke-width="1.05" />
      <path data-part="right-hub" d="M86 65 H110 A6.3 15 0 0 1 110 95 H86 A6.3 15 0 0 1 86 65 Z" fill="white" stroke-width="1.8" />
      <ellipse data-part="near-hub-face" cx="110" cy="80" rx="6.3" ry="15" fill="white" stroke-width="1.05" />
      <path data-part="right-shaft" d="M110 72 H143 A3.36 8 0 0 1 143 88 H110 A3.36 8 0 0 1 110 72 Z" fill="white" stroke-width="1.8" />
      <ellipse data-part="near-shaft-end" cx="143" cy="80" rx="3.36" ry="8" fill="white" stroke-width="1.05" />
    </g>
  </g>
<g id="surface-tone" data-optional="true" fill="#777" fill-opacity="0.20" stroke="none"><g transform="rotate(-14 80 80)"><path d="M21 84 H36 V86 H21 Z M99 91 H104 V93 H99 Z M117 84 H137 V86 H117 Z" /></g></g></svg>