<svg xmlns="http://www.w3.org/2000/svg" width="35mm" height="35mm" viewBox="0 0 160 160" role="img" aria-labelledby="mech-joint-title mech-joint-desc"><title id="mech-joint-title">Pinned lap joint — proposed drafting variant</title><desc id="mech-joint-desc">Two overlapping link ends sit on distinct near and far planes and share a single pin. Only the connection is shown; joint freedoms, dimensions, retention and load capacity are unspecified.</desc><g id="artwork" fill="none" stroke="#303030" stroke-linecap="butt" stroke-linejoin="round"><path d="M17 74 H75 Q96 74 96 92 Q96 110 75 110 H17 Z" fill="white" stroke-width="1.8" /><path d="M17 110 H75 Q94 110 96 94 V100 Q94 116 75 116 H17 Z" fill="white" stroke-width="1.05" /><path d="M143 52 H95 Q74 52 74 71 Q74 90 95 90 H143 V96 H95 Q72 96 70 74 Q70 52 95 52 Z" fill="white" stroke-width="1.05" /><path d="M143 52 H95 Q74 52 74 71 Q74 90 95 90 H143 Z" fill="white" stroke-width="1.8" /><ellipse cx="81" cy="79" rx="8" ry="5.5" fill="white" stroke-width="1.8" /><ellipse cx="81" cy="79" rx="3" ry="2" stroke-width="1.05" /></g><g id="surface-tone" fill="none" stroke="#858585" stroke-width="0.65"><path d="M103 92 H139 M103 94 H139" /></g></svg>