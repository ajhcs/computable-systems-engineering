<title id="title">Pulley A — visible rope path</title><desc id="desc">Diagrammatic face view of one wheel, a continuous rope with two downward tails, and the axle center. The wheel rim is omitted under the coincident upper rope arc so the path remains distinct. The rope groove and load are not physically specified.</desc>
