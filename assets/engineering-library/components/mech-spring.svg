<svg xmlns="http://www.w3.org/2000/svg" width="35mm" height="35mm" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
<title id="title">Compression spring — proposed wire-boundary view</title>
<desc id="desc">Generic open-ended helical compression spring with a single continuous center path and visible wire boundaries. The near strand occludes the far strand at each projected crossing. Four turns and the depicted width are illustrative. The projected ribbon is not an exact three-dimensional round-wire silhouette or a dimensional specification.</desc>
