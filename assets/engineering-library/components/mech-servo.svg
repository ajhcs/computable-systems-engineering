<svg xmlns="http://www.w3.org/2000/svg" width="35mm" height="35mm" viewBox="0 0 160 160" role="img" aria-labelledby="mech-servo-title mech-servo-desc"><title id="mech-servo-title">Servo actuator — proposed drafting variant</title><desc id="mech-servo-desc">Generic rotary servo-style box with a top output boss and horn, with two endpoint marks. A housing and horn do not establish feedback, position, accuracy or a specific product.</desc><g id="artwork" fill="none" stroke="#303030" stroke-linecap="butt" stroke-linejoin="round"><path d="M40 69 L55 59 L127 67 V115 L112 125 L40 117 Z" fill="white" stroke-width="1.8" /><path d="M40 69 L112 77 L127 67 M112 77 V125" stroke-width="1.8" /><path d="M51 94 L103 100" stroke-width="1.05" /><ellipse cx="81" cy="65" rx="9" ry="5" fill="white" stroke-width="1.8" /><path d="M61 62 L101 67 M81 42 V60" stroke-width="1.8" /><ellipse cx="61" cy="62" rx="3" ry="2" fill="white" stroke-width="1.05" /><ellipse cx="101" cy="67" rx="3" ry="2" fill="white" stroke-width="1.05" /></g><g id="surface-tone" fill="none" stroke="#858585" stroke-width="0.65"><path d="M117 79 V119 M122 75 V116" /></g></svg>