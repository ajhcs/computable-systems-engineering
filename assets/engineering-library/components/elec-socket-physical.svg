<svg xmlns="http://www.w3.org/2000/svg" width="35mm" height="35mm" viewBox="0 0 160 160" role="img" aria-labelledby="elec-socket-physical-title elec-socket-physical-desc"><title id="elec-socket-physical-title">Two-contact socket — proposed drafting variant</title><desc id="elec-socket-physical-desc">A generic shallow socket housing with two filled rectangular slots in the front mating face, consistent with the corresponding two-blade plug. No actual mating fit, voltage, rating or standard conformity.</desc><g id="artwork" fill="none" stroke="#303030" stroke-linecap="butt" stroke-linejoin="round"><path d="M45 57 L60 48 L130 56 V110 L115 119 L45 111 Z" fill="white" stroke-width="1.8" /><path d="M45 57 L115 65 L130 56 M115 65 V119" stroke-width="1.8" /><path d="M64 72 L96 75.65 V84.65 L64 81 Z M64 95 L96 98.65 V107.65 L64 104 Z" fill="#303030" stroke="none" /></g><g id="surface-tone" fill="none" stroke="#858585" stroke-width="0.65"><path d="M120 68 V114 M125 65 V111" /></g></svg>