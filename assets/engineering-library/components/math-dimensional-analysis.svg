<svg xmlns="http://www.w3.org/2000/svg" width="35mm" height="35mm" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
<title id="title">Dimensional analysis</title>
<desc id="desc">The dimension of speed is length divided by time. A generic notation example; no model, numerical value or result is asserted. L and T denote dimensions, not unit symbols.</desc>
<g fill="none" stroke="black" stroke-linecap="butt" stroke-linejoin="miter">
<text x="48" y="92" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="30" font-style="italic" stroke="none" fill="black">[v]</text><text x="88" y="92" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="30" stroke="none" fill="black">=</text><text x="121" y="92" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="30" stroke="none" fill="black">L/T</text>
</g>
</svg>
