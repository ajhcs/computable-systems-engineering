<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="35mm" height="35mm" viewBox="0 0 160 160" role="img" aria-labelledby="doc-footnote-title doc-footnote-desc">
<title id="doc-footnote-title">Footnote</title>
<desc id="doc-footnote-desc">A superscript 1 on A matches the numbered footnote reference below. The example contains no substantive note and is not a formal drafting requirement.</desc>
<text x="48" y="65" font-family="Arial, sans-serif" font-size="26" text-anchor="middle" fill="#000000">A</text>
<text x="68" y="48" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#000000">1</text>
<text x="27" y="107" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#000000">1</text>
<text x="40" y="107" font-family="Arial, sans-serif" font-size="18" text-anchor="start" fill="#000000">SEE NOTE</text>
<line data-role="support" fill="none" stroke="#000000" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round" x1="27" y1="80" x2="134" y2="80" />
</svg>