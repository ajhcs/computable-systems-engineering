<svg xmlns="http://www.w3.org/2000/svg" width="35mm" height="35mm" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
<title id="title">Relay — coil and normally open contact</title>
<desc id="desc">A relay coil and a separate normally open contact are linked by a dashed mechanical association. Local schematic example; the coil and contact remain electrically separate. No contact rating or power supply is specified.</desc>
<g fill="none" stroke="black" stroke-linecap="butt" stroke-linejoin="miter">
