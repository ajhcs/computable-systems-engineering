<title id="title">Power supply — AC to DC block</title>
<desc id="desc">A functional block representing an AC-input to DC-output power supply. Functional pictogram only; arrows denote conversion direction and are not terminals. No ratings, waveform, isolation or circuit topology is specified.</desc>
