<svg xmlns="http://www.w3.org/2000/svg" width="35mm" height="35mm" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
<title id="title">Transducer — conversion block</title>
<desc id="desc">A functional block transforming an input quantity x into an output quantity y. Generic conversion pictogram with unspecified x and y domains and transfer function; this generalizes a measurement-transducer reference.</desc>
<g fill="none" stroke="black" stroke-linecap="butt" stroke-linejoin="round">
<rect x="53" y="52" width="54" height="56" stroke-width="2.4"/>
<path d="M17 80 H53 M46 76 L53 80 L46 84 M107 80 H143 M136 76 L143 80 L136 84" stroke-width="1.4"/>
<text x="80" y="89" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="25" stroke="none" fill="black">T</text>
<text x="32" y="68" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-style="italic" font-size="18" stroke="none" fill="black">x</text>
<text x="127" y="68" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-style="italic" font-size="18" stroke="none" fill="black">y</text>
</g>
</svg>
