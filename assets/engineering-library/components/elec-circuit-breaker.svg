<title id="title">Circuit breaker — enclosed open contact</title>
<desc id="desc">An interface pictogram combines a breaker-like enclosure and actuator with a visibly open internal contact. A hybrid pictogram, not an observed device cutaway, protective-device schematic or trip mechanism.</desc>
