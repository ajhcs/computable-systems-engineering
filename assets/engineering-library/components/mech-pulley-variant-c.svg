<title id="title">Pulley C — shallow oblique view</title><desc id="desc">Generic shallow parallel-oblique view. Two equal-height end ellipses share the same axle; the rope follows an intermediate projected ellipse with two free tails and is partially hidden by the opaque near face. The body is simplified and does not specify an actual groove cross-section or manufacturer.</desc>
