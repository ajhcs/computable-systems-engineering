<svg xmlns="http://www.w3.org/2000/svg" width="35mm" height="35mm" viewBox="0 0 160 160" role="img" aria-labelledby="doc-revision-marker-title doc-revision-marker-desc">
<title id="doc-revision-marker-title">Revision marker</title>
<desc id="doc-revision-marker-desc">A triangular revision marker with synthetic letter A points to an illustrative changed feature. The marker is not an approval, a revision record or proof of a change.</desc>
<path data-role="contour" fill="none" stroke="#000000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M33 104 H119 V52 H33 Z"/>
<circle data-role="feature" fill="none" stroke="#000000" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" cx="80" cy="78" r="8"/>
<polygon data-role="glyph" fill="none" stroke="#000000" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" points="118,27 131,49 105,49"/>
<text x="118" y="45" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#000000">A</text>
<line data-role="support" fill="none" stroke="#000000" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" x1="110" y1="49" x2="86" y2="73"/>
</svg>
