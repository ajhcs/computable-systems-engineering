<svg xmlns="http://www.w3.org/2000/svg" width="35mm" height="35mm" viewBox="0 0 160 160" role="img" aria-labelledby="elec-transistor-physical-title elec-transistor-physical-desc"><title id="elec-transistor-physical-title">Three-lead package — proposed drafting variant</title><desc id="elec-transistor-physical-desc">Generic TO-92-like package with a flat face, bevel boundaries, a shallow top plane and three separate parallel leads. No pinout or semiconductor type is assigned.</desc><g id="artwork" fill="none" stroke="#303030" stroke-linecap="butt" stroke-linejoin="round"><path d="M64 78 V132 M80 78 V132 M96 78 V132" stroke-width="1.8" /><path d="M50 42 L57 35 H103 L110 42 V78 H50 Z" fill="white" stroke-width="1.8" /><path d="M50 42 H110 M57 42 V78 M103 42 V78" stroke-width="1.05" /></g><g id="surface-tone" fill="none" stroke="#858585" stroke-width="0.65"><path d="M106 49 V73 M108 50 V72" /></g></svg>