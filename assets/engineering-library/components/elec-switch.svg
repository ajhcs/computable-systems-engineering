<line x1="20" y1="80" x2="54" y2="80" stroke-width="2.4" /><line x1="110" y1="80" x2="140" y2="80" stroke-width="2.4" /><circle cx="54" cy="80" r="2.8" stroke-width="0" fill="black" /><circle cx="110" cy="80" r="2.8" stroke-width="0" fill="black" /><line x1="54" y1="80" x2="99" y2="54" stroke-width="2.4" data-role="open-blade"/>
</g>
