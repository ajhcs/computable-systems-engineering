<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSE · Start a physical model</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#111;background:#fff;font:16px/1.5 system-ui,sans-serif}header,main{padding:16px 20px;max-width:1400px;margin:auto}header{border-bottom:1px solid #777}h1{font-size:22px;margin:0 0 8px}h2{font-size:18px}p{margin:8px 0;overflow-wrap:anywhere}fieldset{border:0;margin:0;padding:0;min-width:0}label{display:block;margin:12px 0}input,select,button{font:inherit;color:inherit;background:#fff;border:1px solid #555;padding:9px;max-width:100%}input,select{display:block;width:26rem}button{cursor:pointer;min-height:44px}button:disabled{color:#666;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #111;outline-offset:3px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}#notice{font-weight:600}#candidate{border:1px solid #777;padding:16px;margin:16px 0;min-width:0}iframe{display:block;width:100%;height:460px;border:1px solid #777}pre,code{font-family:'DejaVu Sans Mono',monospace;white-space:pre-wrap;overflow-wrap:anywhere}summary{cursor:pointer;padding:8px 0;min-height:44px}#native-properties{white-space:pre-wrap}#candidate[hidden],#package-field[hidden],button[hidden]{display:none}@media(max-width:650px){header,main{padding:12px}#candidate{padding:12px}}
</style>
<header><h1>Start a physical model</h1><p id="saved-state">Connecting to the private initial session…</p><p id="notice" role="status" aria-live="polite"></p></header>
<main><form id="initial-form"><fieldset id="initial-fields" disabled><label>Root kind<select id="root-kind" required><option value="">Choose a root kind</option><option value="definition">Part definition</option><option value="usage">Part usage</option></select></label><label>Declared name<input id="root-name" autocomplete="off" required></label><label>Short ID (optional)<input id="root-short" autocomplete="off"></label><label>Model package<select id="namespace-mode" required><option value="">Choose where to declare the root</option><option value="global">Unnamed namespace</option><option value="package">Named package</option></select></label><label id="package-field" hidden>Package name<input id="package-name" autocomplete="off"></label><p id="root-meaning"></p><button id="preview-initial" type="submit">Preview model</button></fieldset></form>
<section id="candidate" hidden aria-label="Initial model candidate"><h2 id="candidate-title">Unsaved initial candidate</h2><p id="candidate-status"></p><p id="native-properties"></p><p>Selected configuration review: unconfigured. This declaration does not assert installed presence.</p><div class="actions"><button id="candidate-readable" type="button">Readable size</button><button id="candidate-overview" type="button">Overview</button><span id="font-status" role="status"></span></div><p>At readable size, scroll inside the diagram to see its full width.</p><iframe id="initial-diagram" title="Unsaved source-bound physical root" sandbox="allow-same-origin" tabindex="0"></iframe><details><summary>Native sources and identity</summary><pre id="candidate-source"></pre><p id="candidate-identity"></p></details></section>
<div class="actions"><button id="create-initial" type="button" disabled>Create model</button><button id="edit-draft" type="button" disabled>Edit draft</button><button id="recover-initial" type="button" hidden>Recover same creation</button><button id="open-saved" type="button" hidden>Open saved model</button></div><p id="receipt-summary"></p>
</main><script src="/initial.js"></script></html>
