<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSE local physical composition</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font:16px system-ui,sans-serif}header,section{padding:12px 20px;border-bottom:1px solid #888}h1{font-size:20px;margin:0 0 6px}p{margin:8px 0;overflow-wrap:anywhere}fieldset{border:0;padding:0;margin:0}form{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:end;margin:10px 0}label{display:flex;flex-direction:column;gap:4px}input,button,select{font:inherit;color:inherit;background:#fff;border:1px solid #555;padding:7px}button{cursor:pointer}button:disabled{color:#666;cursor:default}input[type=number]{width:105px}#rename-name{width:220px}#notice{font-weight:600}#preview{border:1px solid #888;padding:12px;margin:12px 0}#summary{white-space:pre-wrap}iframe{width:100%;height:calc(100vh - 120px);min-height:680px;border:0;display:block}.actions{display:flex;flex-wrap:wrap;gap:10px}#pending-indicator{font-weight:600}@media(max-width:600px){header,section{padding:12px}form{align-items:start}#rename-name{max-width:100%}iframe{min-height:800px}button{min-height:42px}}
</style>
<header><h1>CSE physical composition · local development</h1><p id="saved">Connecting to the private project…</p><p id="notice" role="status" aria-live="polite"></p></header>
<section aria-label="Edit the selected model element">
<p id="selected">Select an element in the saved diagram.</p>
<p id="edit-target"></p><div class="actions"><button id="return-target" type="button" hidden>Return to the edit target</button><button id="edit-selected" type="button" hidden>Start a new edit on the selection (discard draft)</button><button id="discard-draft" type="button" hidden>Discard form draft</button></div>
<fieldset id="edits" disabled>
<form id="rename-form"><label>Declared name<input id="rename-name" autocomplete="off" required></label><button id="preview-rename">Preview rename</button></form>
<form id="layout-form"><label>X<input id="box-x" type="number" step="any" required></label><label>Y<input id="box-y" type="number" step="any" required></label><label>Width<input id="box-width" type="number" step="any" required></label><label>Height<input id="box-height" type="number" step="any" required></label><button id="preview-layout">Preview layout</button><label>Drag action<select id="drag-action"><option value="move">Move frame</option><option value="resize">Resize frame</option></select></label></form>
<p>Dragging changes layout. Native ownership and retained configuration scope stay separate.</p>
<form id="restore-form"><label>Saved revision<select id="restore-target"></select></label><button>Preview restoration</button></form>
</fieldset>
<div id="preview" hidden><p id="pending-indicator">Unsaved change</p><p id="summary"></p><div class="actions"><button id="save" type="button">Save change</button><button id="discard" type="button">Discard pending change</button></div></div>
<button id="refresh" type="button">Refresh saved project</button>
</section>
<iframe id="view" title="Saved physical composition and native properties" referrerpolicy="no-referrer"></iframe>
<script src="/app.js"></script>
</html>
