<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSE physical composition</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#111;background:#fff;font:16px system-ui,sans-serif}header{padding:16px 24px;border-bottom:1px solid #777}h1{font-size:20px;margin:0 0 8px}main{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:85vh}.diagram{max-height:calc(100vh - 100px);overflow:auto;padding:12px;border-right:1px solid #888}svg{display:block;max-width:none}aside{max-height:calc(100vh - 100px);overflow-y:auto;padding:20px;overflow-wrap:anywhere}h2{font-size:18px;margin:0 0 12px}h3{font-size:16px;margin:24px 0 8px}dl{margin:0}dt{font-weight:600;margin-top:12px}dd{margin:3px 0 0;white-space:pre-wrap}a{color:#111}button{font:inherit;color:inherit;background:#fff;border:1px solid #555;padding:8px 12px;margin:0 8px 12px 0}g[data-node-id]{cursor:pointer}g[data-node-id]:focus,g[data-node-id][aria-pressed=true]{outline:3px solid #777;outline-offset:4px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #888;padding:8px;text-align:left;vertical-align:top}details{margin-top:12px}#selection-context{white-space:pre-wrap;font-size:12px}#scroll-hint{margin:0 0 10px}@media(max-width:850px){main{grid-template-columns:minmax(0,1fr)}.diagram{max-height:none;border-right:0;border-bottom:1px solid #888;height:65vh}aside{max-height:none;overflow:visible;padding:20px}}
</style>
<header><h1>CSE physical composition</h1><span id="revision"></span> · read-only snapshot · <a href="view.svg">SVG</a> · <a href="view.json">source bindings</a></header>
<main><section class="diagram" aria-label="Physical composition diagram"><p id="scroll-hint">Scroll to inspect the diagram at its readable size.</p><!-- CSE_SVG --></section>
<aside aria-label="Selected model element"><h2>Properties</h2><button id="previous" type="button">Previous element</button><button id="next" type="button">Next element</button><dl id="properties"></dl><h3>Retained configuration reviews</h3><div id="reviews"></div><h3>Declarations outside this view</h3><div id="omissions"></div><details><summary>Selection identity</summary><pre id="selection-context"></pre></details></aside></main>
<script id="cse-data" type="application/json"><!-- CSE_DATA --></script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('cse-data').textContent), projection=data.projection, nodes=Object.entries(projection.nodes);
document.querySelector('.diagram svg').setAttribute('role','group');
const session=globalThis.crypto?.randomUUID?.() || null;
let selected=0;
document.getElementById('revision').textContent='Saved revision '+data.revision+' · '+projection.id;
function field(term,value){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=term;dd.textContent=value;document.getElementById('properties').append(dt,dd)}
function revealOccurrence(id){const area=document.querySelector('.diagram'),target=document.querySelector('g[data-node-id=\"'+id+'\"]'),a=area.getBoundingClientRect(),r=target.getBoundingClientRect(),padding=12;let dx=0,dy=0;if(r.width>a.width-2*padding)dx=(r.left+r.right-a.left-a.right)/2;else if(r.left<a.left+padding)dx=r.left-a.left-padding;else if(r.right>a.right-padding)dx=r.right-a.right+padding;if(r.height>a.height-2*padding)dy=(r.top+r.bottom-a.top-a.bottom)/2;else if(r.top<a.top+padding)dy=r.top-a.top-padding;else if(r.bottom>a.bottom-padding)dy=r.bottom-a.bottom+padding;area.scrollLeft+=dx;area.scrollTop+=dy;}
function select(index,reveal=false){selected=(index+nodes.length)%nodes.length;const [id,node]=nodes[selected],n=node.native;document.getElementById('properties').replaceChildren();field('Name',n.name||node.element);if(data.display_labels[id]!==n.name)field('Display label',data.display_labels[id]);field('Kind',node.kind==='PartDefinition'?'Part definition':'Part usage');field('Native name',node.element);field('Native owner',n.owner||'Unavailable');if(n.id)field('Short ID',n.id);if(n.types?.length)field('Direct types',n.types.join('\n'));if(n.multiplicity){const m=n.multiplicity;field('Multiplicity',m.lower===undefined?m.status:(m.lower===m.upper?'['+m.lower+']':'['+m.lower+'..'+m.upper+']')+' · '+m.status);if(n.source_multiplicity&&!['literal','default'].includes(m.status))field('Declared bound',n.source_multiplicity)}if(n.is_composite!==undefined)field('Native composition',n.is_composite?'Composite':'Non-composite');for(const [key,label] of [['supertypes','Supertypes'],['redefines','Redefines'],['subsets','Subsets']])if(n[key]?.length)field(label,n[key].join('\n'));if(n.is_variation||n.is_variant)field('Variation','Unresolved');if(n.has_native_value)field('Native value','Inspect source');document.querySelectorAll('g[data-node-id]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.nodeId===id)));const context={project_id:projection.project_id,view_id:projection.id,ui_session_id:session,model_revision:data.revision,commit:data.commit,bundle_sha256:projection.bundle_sha256,selected_element_ids:[node.element_id],selected_occurrence_ids:[id],scope:'saved_artifact_selection_only'};document.getElementById('selection-context').textContent=JSON.stringify(context,null,2);globalThis.cseSelectionContext=context;if(reveal)revealOccurrence(id);}
document.querySelectorAll('g[data-node-id]').forEach(el=>{const i=nodes.findIndex(([id])=>id===el.dataset.nodeId);el.setAttribute('tabindex','0');el.setAttribute('role','button');el.setAttribute('aria-label',projection.nodes[el.dataset.nodeId].native.name||projection.nodes[el.dataset.nodeId].element);el.addEventListener('click',()=>select(i));el.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();select(i)}})});
document.getElementById('previous').addEventListener('click',()=>select(selected-1,true));document.getElementById('next').addEventListener('click',()=>select(selected+1,true));
if(!projection.configuration_reviews.length)document.getElementById('reviews').textContent='No retained configuration scope supplied.';
for(const review of projection.configuration_reviews){const section=document.createElement('section'),heading=document.createElement('strong');heading.textContent=review.file+' · '+review.report.status;section.append(heading);const scope=review.retained_scope,bindings=[scope.root,...Object.values(scope.selected_roles),...Object.values(scope.external_roles||{})],retained=document.createElement('p');retained.textContent='Retained native bindings: '+bindings.map(binding=>binding.native_name).join('; ');section.append(retained);for(const finding of review.report.findings||[]){const p=document.createElement('p');p.textContent=finding.status+' · '+finding.id+' · '+finding.detail;section.append(p)}document.getElementById('reviews').append(section)}
for(const omitted of projection.omitted_elements){const p=document.createElement('p');p.textContent=omitted.element+' · owner: '+(omitted.owner||'Unavailable');document.getElementById('omissions').append(p)}
select(0);
</script></html>
