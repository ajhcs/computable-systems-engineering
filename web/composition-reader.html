<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSE physical composition</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#111;background:#fff;font:16px system-ui,sans-serif}header{padding:16px 24px;border-bottom:1px solid #777}h1{font-size:20px;margin:0 0 8px}main{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:85vh}.diagram{height:calc(100vh - 100px);min-height:340px;min-width:0;display:flex;flex-direction:column;border-right:1px solid #888}.diagram-navigation{flex:none;padding:12px 12px 0;border-bottom:1px solid #888;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px}.diagram-navigation button{margin-right:0}.diagram-navigation span{font-size:14px;margin-bottom:12px}#diagram-viewport{flex:1;min-height:0;overflow:auto;padding:12px}#diagram-viewport[data-mode=overview]{overflow:hidden}svg{display:block;max-width:none}aside{max-height:calc(100vh - 100px);overflow-y:auto;padding:20px;overflow-wrap:anywhere}h2{font-size:18px;margin:0 0 12px}h3{font-size:16px;margin:24px 0 8px}dl{margin:0}dt{font-weight:600;margin-top:12px}dd{margin:3px 0 0;white-space:pre-wrap}a{color:#111}button{font:inherit;color:inherit;background:#fff;border:1px solid #555;padding:8px 12px;margin:0 8px 12px 0}g[data-node-id]{cursor:pointer;scroll-margin:12px}g[data-node-id]:focus,g[data-node-id][aria-pressed=true]{outline:3px solid #777;outline-offset:4px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #888;padding:8px;text-align:left;vertical-align:top}details{margin-top:12px}#selection-context{white-space:pre-wrap;font-size:12px}#scroll-hint{margin:0 0 10px}@media(max-width:850px){main{grid-template-columns:minmax(0,1fr)}.diagram{border-right:0;border-bottom:1px solid #888;height:65vh}aside{max-height:none;overflow:visible;padding:20px}}
.diagram-column{min-width:0}.diagram-column .diagram{height:min(65vh,620px)}.inspection-tables{padding:16px;border-top:1px solid #888}.inspection-tables h2{margin-top:16px}.table-scroll{overflow-x:auto;max-width:100%}.declaration-table{min-width:700px}.role-table{min-width:700px}button[data-inspection-id]{max-width:100%;overflow-wrap:anywhere}button[data-inspection-id][aria-pressed=true]{outline:3px solid #777;outline-offset:-4px}aside{position:sticky;top:0;align-self:start}@media(max-width:850px){aside{position:static}}
</style>
<header><h1>CSE physical composition</h1><span id="revision"></span> · read-only snapshot · <a href="view.svg">SVG</a> · <a href="view.json">source bindings</a></header>
<main><div class="diagram-column"><section class="diagram" aria-label="Physical composition diagram"><nav class="diagram-navigation" aria-label="Diagram navigation"><button id="overview" type="button" aria-pressed="false">Overview</button><button id="readable" type="button" aria-pressed="true">Readable size</button><span id="view-mode" aria-live="polite">Readable size · 100%</span></nav><div id="diagram-viewport" tabindex="0" aria-label="Scrollable diagram at readable size"><!-- CSE_SVG --></div></section><section class="inspection-tables"><h2>Native declarations</h2><div id="declaration-rows"></div><h2>Retained configuration roles</h2><div id="role-rows"></div></section></div>
<aside aria-label="Selected model element"><h2>Properties</h2><button id="previous" type="button">Previous diagram frame</button><button id="next" type="button">Next diagram frame</button><dl id="properties"></dl><h3>Retained configuration reviews</h3><div id="reviews"></div><h3>Declarations outside this view</h3><div id="omissions"></div><details><summary>Selection identity</summary><pre id="selection-context"></pre></details></aside></main>
<script id="cse-data" type="application/json"><!-- CSE_DATA --></script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('cse-data').textContent), projection=data.projection, nodes=Object.entries(projection.nodes);
document.querySelector('.diagram svg').setAttribute('role','group');
const session=globalThis.crypto?.randomUUID?.() || null;
let selected=0;
const viewport=document.getElementById('diagram-viewport'),drawing=viewport.querySelector('svg');
const naturalSize={width:drawing.viewBox.baseVal.width,height:drawing.viewBox.baseVal.height};
let navigationMode='readable',navigationScale=1,navigationRevision=0,navigationLocked=false,navigationSignature=null;
function navigationState(){return{mode:navigationMode,scale:navigationScale,revision:navigationRevision,
  scroll_left:viewport.scrollLeft,scroll_top:viewport.scrollTop,
  viewport_width:viewport.clientWidth,viewport_height:viewport.clientHeight,
  drawing_width:naturalSize.width,drawing_height:naturalSize.height,locked:navigationLocked};}
function navigationChanged(){
  const {revision,...values}=navigationState(),signature=JSON.stringify(values);
  if(signature===navigationSignature)return;
  navigationSignature=signature;
  navigationRevision++;
  if(globalThis.cseSelectionContext){globalThis.cseSelectionContext.navigation=navigationState();document.getElementById('selection-context').textContent=JSON.stringify(globalThis.cseSelectionContext,null,2);}
  document.dispatchEvent(new CustomEvent('cse-navigation-change'));
}
function fitDrawing(){
  const scale=navigationMode==='overview'?Math.min(1,Math.max(1,viewport.clientWidth-24)/naturalSize.width,Math.max(1,viewport.clientHeight-24)/naturalSize.height):1;
  navigationScale=scale;drawing.style.width=naturalSize.width*scale+'px';drawing.style.height=naturalSize.height*scale+'px';
  viewport.dataset.mode=navigationMode;
  viewport.setAttribute('aria-label',navigationMode==='overview'?'Complete diagram overview; select a frame to read it':'Scrollable diagram at readable size');
  document.getElementById('overview').setAttribute('aria-pressed',String(navigationMode==='overview'));
  document.getElementById('readable').setAttribute('aria-pressed',String(navigationMode==='readable'));
  document.getElementById('view-mode').textContent=(navigationMode==='overview'?'Overview':'Readable size')+' · '+Number((scale*100).toFixed(1))+'%';
}
function setViewMode(mode){
  if(!['overview','readable'].includes(mode))throw new Error('Choose overview or readable size.');
  if(navigationLocked)throw new Error('Finish the active gesture before navigating.');
  navigationMode=mode;fitDrawing();
  if(mode==='overview'){viewport.scrollLeft=0;viewport.scrollTop=0;}
  navigationChanged();return navigationState();
}
function revealOccurrence(id){
  const target=[...drawing.querySelectorAll('g[data-node-id]')].find(node=>node.dataset.nodeId===id);
  if(!target)throw new Error('Occurrence is absent from this saved view.');
  setViewMode('readable');
  const a=viewport.getBoundingClientRect(),r=target.getBoundingClientRect(),padding=12;let dx=0,dy=0;
  if(r.width>a.width-2*padding)dx=(r.left+r.right-a.left-a.right)/2;else if(r.left<a.left+padding)dx=r.left-a.left-padding;else if(r.right>a.right-padding)dx=r.right-a.right+padding;
  if(r.height>a.height-2*padding)dy=(r.top+r.bottom-a.top-a.bottom)/2;else if(r.top<a.top+padding)dy=r.top-a.top-padding;else if(r.bottom>a.bottom-padding)dy=r.bottom-a.bottom+padding;
  viewport.scrollLeft+=dx;viewport.scrollTop+=dy;target.scrollIntoView({block:'nearest',inline:'nearest'});navigationChanged();return navigationState();
}
globalThis.cseDiagramNavigation=Object.freeze({
  state:navigationState,
  mode(mode){if(mode==='readable'&&occurrences[selectedOccurrence].frame_id)return revealOccurrence(occurrences[selectedOccurrence].frame_id);return setViewMode(mode);},
  reveal:revealOccurrence,
  restore(saved){setViewMode(saved.mode);if(saved.mode==='readable'){viewport.scrollLeft=saved.scroll_left;viewport.scrollTop=saved.scroll_top;navigationChanged();}return navigationState();},
  lock(value){if(navigationLocked===value)return;navigationLocked=value;for(const id of ['overview','readable','previous','next'])document.getElementById(id).disabled=value;drawing.querySelectorAll('g[data-node-id]').forEach(node=>node.setAttribute('aria-disabled',String(value)));document.querySelectorAll('.inspection-tables button').forEach(node=>node.disabled=value);if(!value){renderDeclarations();renderScopes();}navigationChanged();}
});
document.getElementById('overview').addEventListener('click',()=>setViewMode('overview'));
document.getElementById('readable').addEventListener('click',()=>revealOccurrence(nodes[selected][0]));
viewport.addEventListener('scroll',navigationChanged);
new ResizeObserver(()=>{fitDrawing();navigationChanged();}).observe(viewport);
fitDrawing();
document.getElementById('revision').textContent='Saved revision '+data.revision+' · '+projection.id;
function field(term,value){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=term;dd.textContent=value;document.getElementById('properties').append(dt,dd)}
const inspection=projection.inspection,occurrences=inspection.occurrences,pageSize=25;
let selectedOccurrence=nodes[0][0],declarationOffset=0;const scopeOffsets=new Map();
const origins={frame:'Diagram element',declaration:'Native declaration',configuration_root:'Retained design context',selected_role:'Retained selected role',external_role:'Retained external peer'};
function sourceName(row){return row.native?.name||row.element}
function boundText(n){const m=n?.multiplicity;if(!m)return'—';if(n.source_multiplicity)return n.source_multiplicity;return m.lower===undefined?m.status:(m.lower===m.upper?'['+m.lower+']':'['+m.lower+'..'+m.upper+']')+' · '+m.status}
function cell(row,value){const td=document.createElement('td');td.textContent=value;row.append(td);return td}
function buttonCell(row,occurrence,label){const td=document.createElement('td'),button=document.createElement('button');button.textContent=label;button.dataset.inspectionId=occurrence;button.setAttribute('aria-pressed',String(occurrence===selectedOccurrence));button.disabled=navigationLocked;button.addEventListener('click',()=>selectOccurrence(occurrence));td.append(button);row.append(td)}
function pager(container,offset,total,change){const controls=document.createElement('div');for(const[caption,next,disabled]of[['Previous page',Math.max(0,offset-pageSize),offset===0],['Next page',offset+pageSize,offset+pageSize>=total]]){const b=document.createElement('button');b.textContent=caption;b.dataset.inspectionPage=caption;b.disabled=navigationLocked||disabled;b.addEventListener('click',()=>{const updated=change(next),buttons=[...updated.querySelectorAll('[data-inspection-page]')],target=buttons.find(button=>button.dataset.inspectionPage===caption&&!button.disabled)||updated.querySelector('[data-inspection-id]')||buttons.find(button=>!button.disabled);target?.focus({preventScroll:true});target?.scrollIntoView({block:'nearest',inline:'nearest'})});controls.append(b)}const count=document.createElement('span');count.textContent=total?(offset+1)+'–'+Math.min(total,offset+pageSize)+' of '+total:'0 entries';controls.append(count);container.append(controls)}
function renderDeclarations(){const container=document.getElementById('declaration-rows');container.replaceChildren();const wrap=document.createElement('div');wrap.className='table-scroll';const table=document.createElement('table');table.className='declaration-table';const header=document.createElement('tr');for(const title of['Declaration / kind','Native owner','Direct types','Bound']){const th=document.createElement('th');th.textContent=title;header.append(th)}const head=document.createElement('thead');head.append(header);table.append(head);const body=document.createElement('tbody');
 for(const id of inspection.declarations.slice(declarationOffset,declarationOffset+pageSize)){const row=occurrences[id],tr=document.createElement('tr');buttonCell(tr,id,row.element+' · '+(row.kind==='PartDefinition'?'definition':'usage'));cell(tr,row.native.owner||'Unavailable');cell(tr,(row.native.types||row.native.supertypes||[]).join('\n')||'—');cell(tr,boundText(row.native));body.append(tr)}table.append(body);wrap.append(table);container.append(wrap);pager(container,declarationOffset,inspection.declarations.length,next=>{declarationOffset=next;renderDeclarations();return container})}
function parentText(role){if(role.kind==='external_role')return'No selected parent · external peer';if(role.kind==='configuration_root')return'Design context';return role.selected_parent?.native_name||'Unresolved selected parent'}
function renderScopes(){const container=document.getElementById('role-rows');container.replaceChildren();if(!inspection.scopes.length){container.textContent='No retained configuration scope supplied.';return}
 for(const scope of inspection.scopes){const section=document.createElement('section'),heading=document.createElement('h3');section.dataset.scopeFile=scope.file;heading.textContent=scope.file+' · '+scope.report.status;section.append(heading);const offset=scopeOffsets.get(scope.file)||0,wrap=document.createElement('div');wrap.className='table-scroll';const table=document.createElement('table');table.className='role-table';const head=document.createElement('thead'),header=document.createElement('tr');for(const title of['Retained role / kind','Requested declaration','Selected parent','Review findings']){const th=document.createElement('th');th.textContent=title;header.append(th)}head.append(header);table.append(head);const body=document.createElement('tbody');
  for(const id of scope.occurrences.slice(offset,offset+pageSize)){const row=occurrences[id],role=row.role,tr=document.createElement('tr');buttonCell(tr,id,role.kind==='configuration_root'?'Design context':role.id+' · '+(role.kind==='external_role'?'external peer':'selected role'));cell(tr,role.binding.native_name);cell(tr,parentText(role));cell(tr,role.checked?'pass · reconciled':role.findings.map(f=>f.status+' · '+f.rule).join('\n')||'Not checked');body.append(tr)}table.append(body);wrap.append(table);section.append(wrap);pager(section,offset,scope.occurrences.length,next=>{scopeOffsets.set(scope.file,next);renderScopes();return [...container.children].find(child=>child.dataset.scopeFile===scope.file)});const details=document.createElement('details'),summary=document.createElement('summary'),pre=document.createElement('pre');summary.textContent='Scope identity';pre.textContent=scope.scope_sha256;details.append(summary,pre);section.append(details);container.append(section)}
}
function revealInspection(id,focus=false){if(navigationLocked)throw Error('Finish the active gesture before navigating.');const row=Object.hasOwn(occurrences,id)?occurrences[id]:null;if(!row)throw Error('Inspection occurrence is absent from this snapshot.');
 if(row.frame_id){revealOccurrence(row.frame_id);const group=[...drawing.querySelectorAll('g[data-node-id]')].find(e=>e.dataset.nodeId===row.frame_id);if(focus)group?.focus({preventScroll:true});return}
 if(row.origin==='declaration'){declarationOffset=Math.floor(inspection.declarations.indexOf(id)/pageSize)*pageSize;renderDeclarations()}
 else{const scope=inspection.scopes.find(s=>s.file===row.role.file);scopeOffsets.set(scope.file,Math.floor(scope.occurrences.indexOf(id)/pageSize)*pageSize);renderScopes()}
 const button=[...document.querySelectorAll('[data-inspection-id]')].find(e=>e.dataset.inspectionId===id);button?.scrollIntoView({block:'nearest',inline:'nearest'});if(focus)button?.focus({preventScroll:true});}
function selectOccurrence(id,{reveal=false,focus=false}={}){if(navigationLocked)return false;const node=Object.hasOwn(occurrences,id)?occurrences[id]:null;if(!node)throw Error('Inspection occurrence is absent from this snapshot.');const fromOverview=navigationMode==='overview';selectedOccurrence=id;const frameIndex=nodes.findIndex(([key])=>key===node.frame_id);if(frameIndex>=0)selected=frameIndex;const n=node.native;document.getElementById('properties').replaceChildren();field('Inspecting',origins[node.origin]);
 if(node.role){const role=node.role;field('Retained role',role.kind==='configuration_root'?'Design context':role.id);field('Selected parent',parentText(role));field('Requested native name',role.binding.native_name);field('Selected direct type',role.binding.type);field('Role review',role.checked?'Reconciled declaration':'Not reconciled');if(role.membership)field('Membership correspondence',({usage_owned:'Declaration owned by selected usage',type_owned:'Declaration owned by selected type',inherited:'Inherited declaration'}[role.membership]));for(const finding of role.findings)field(finding.rule,finding.status+' · '+finding.detail);field('Complete scope review',role.file+' · '+role.review_status)}
 if(n){field('Name',n.name||node.element);if(node.frame_id&&data.display_labels[id]!==n.name)field('Display label',data.display_labels[id]);field('Kind',node.kind==='PartDefinition'?'Part definition':'Part usage');field('Native name',node.element);field('Native owner',n.owner||'Unavailable');if(n.id)field('Short ID',n.id);if(n.types?.length)field('Direct types',n.types.join('\n'));if(n.multiplicity){const m=n.multiplicity;field('Multiplicity',m.lower===undefined?m.status:(m.lower===m.upper?'['+m.lower+']':'['+m.lower+'..'+m.upper+']')+' · '+m.status);if(n.source_multiplicity&&!['literal','default'].includes(n.multiplicity.status))field('Declared bound',n.source_multiplicity)}if(n.is_composite!==undefined)field('Native composition',n.is_composite?'Composite':'Non-composite');for(const[key,label]of[['supertypes','Supertypes'],['redefines','Redefines'],['subsets','Subsets']])if(n[key]?.length)field(label,n[key].join('\n'));if(n.is_variation||n.is_variant)field('Variation','Unresolved');if(n.has_native_value)field('Native value','Inspect source');if(node.source_location)field('Source',node.source_location.file+' · line '+node.source_location.line)}
 else field('Native declaration','Missing. No native UUID or edit target is inferred.');
 document.querySelectorAll('g[data-node-id]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.nodeId===node.frame_id)));document.querySelectorAll('[data-inspection-id]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.inspectionId===id)));
 const context={project_id:projection.project_id,view_id:projection.id,ui_session_id:session,model_revision:data.revision,commit:data.commit,bundle_sha256:projection.bundle_sha256,selected_element_ids:node.element_id?[node.element_id]:[],selected_occurrence_ids:[id],selection_origin:node.origin,retained_role:node.role,scope:'saved_artifact_selection_only',navigation:navigationState()};document.getElementById('selection-context').textContent=JSON.stringify(context,null,2);globalThis.cseSelectionContext=context;if(reveal||fromOverview&&node.frame_id)revealInspection(id,focus);document.dispatchEvent(new CustomEvent('cse-selection-change'));return true;
}
function select(index,reveal=false){return selectOccurrence(nodes[(index+nodes.length)%nodes.length][0],{reveal})}
globalThis.cseReaderSelection=Object.freeze({select:selectOccurrence,reveal:revealInspection,state:()=>({occurrence_id:selectedOccurrence,element_id:occurrences[selectedOccurrence].element_id,origin:occurrences[selectedOccurrence].origin})});
document.querySelectorAll('g[data-node-id]').forEach(el=>{const id=el.dataset.nodeId;el.setAttribute('tabindex','0');el.setAttribute('role','button');el.setAttribute('aria-label',projection.nodes[id].native.name||projection.nodes[id].element);el.addEventListener('click',()=>selectOccurrence(id));el.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();selectOccurrence(id)}})});
document.getElementById('previous').addEventListener('click',()=>select(selected-1,true));document.getElementById('next').addEventListener('click',()=>select(selected+1,true));
if(!projection.configuration_reviews.length)document.getElementById('reviews').textContent='No retained configuration scope supplied.';
for(const review of projection.configuration_reviews){const section=document.createElement('section'),heading=document.createElement('strong');heading.textContent=review.file+' · '+review.report.status;section.append(heading);const scope=review.retained_scope,bindings=[scope.root,...Object.values(scope.selected_roles),...Object.values(scope.external_roles||{})],retained=document.createElement('p');retained.textContent='Retained native bindings: '+bindings.map(binding=>binding.native_name).join('; ');section.append(retained);for(const finding of review.report.findings||[]){const p=document.createElement('p');p.textContent=finding.status+' · '+finding.id+' · '+finding.detail;section.append(p)}document.getElementById('reviews').append(section)}
for(const omitted of projection.omitted_elements){const p=document.createElement('p');p.textContent=omitted.element+' · owner: '+(omitted.owner||'Unavailable');document.getElementById('omissions').append(p)}
renderDeclarations();renderScopes();select(0);
</script></html>
