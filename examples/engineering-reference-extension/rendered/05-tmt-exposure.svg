<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc"><title id="title">TMT Take SH Exposure: source-style Activity reading</title><desc id="desc">Initial node forks into sending SH_Take_exposure_Cmd with dit Integer via PEAS2SHOut and accepting SH_Take_exposure_Ack. Both branches join before the final node. Six control flows and one input object flow retained. No Ack image field or executable behavior is asserted.</desc><rect width="1280" height="900" fill="white" /><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#172F45" stroke-width="2" /></marker></defs><text x="52" y="48" font-size="28" font-family="Arial, sans-serif" fill="#172F45">Take SH Exposure</text><text x="52" y="81" font-size="18" font-family="Arial, sans-serif" fill="#172F45">TMT APS | selected SysML 1.4 Activity reading | original source semantics</text><line x1="52" y1="105" x2="1228" y2="105" stroke="#4F6678" /><polyline points="580,285 580,405" fill="none" stroke="#172F45" stroke-width="2" marker-end="url(#arrow)" data-source-id="_17_0_2_3_41e01aa_1383810509352_353468_75620" data-source="_18_0_5_baa02e2_1457628566053_846606_159260" data-target="_17_0_2_3_41e01aa_1383810481906_821693_75583" data-flow-type="uml:ControlFlow" /><polyline points="1005,285 1005,405" fill="none" stroke="#172F45" stroke-width="2" marker-end="url(#arrow)" data-source-id="_17_0_2_3_41e01aa_1383810511466_177984_75625" data-source="_18_0_5_baa02e2_1457628566053_846606_159260" data-target="_17_0_2_3_41e01aa_1383810483618_843330_75595" data-flow-type="uml:ControlFlow" /><polyline points="805,635 805,709" fill="none" stroke="#172F45" stroke-width="2" marker-end="url(#arrow)" data-source-id="_17_0_2_3_41e01aa_1383810517529_853279_75637" data-source="_18_0_5_baa02e2_1457628574540_652543_159280" data-target="_17_0_2_3_41e01aa_1382548455558_