<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900"><title>04-ape-optical</title><desc>New model-derived selected view. Original notation/version, trace IDs and omissions are documented in the matched explanation. Not a native Cameo export.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#4F6678" /></marker></defs><rect width="1280" height="900" fill="#FFFFFF" /><g font-family="Arial, sans-serif"><text x="52" y="48" font-size="28" fill="#172F45" font-weight="600" text-anchor="start" data-source-id="" font-family="Arial, sans-serif">ESO APE reference | Optical boundary and nested ports</text><text x="52" y="82" font-size="17" fill="#4F6678" font-weight="400" text-anchor="start" data-source-id="">Model-derived simplified SysML v1 internal-block view | new layout preserves connectors, not invented flows</text><polyline points="52,104 1228,104" fill="none" stroke="#4F6678" stroke-width="1.7" data-source-id="" /><rect x="52" y="134" width="1176" height="613" rx="0" fill="#FFFFFF" stroke="#4F6678" stroke-width="1.5" data-source-id="_15_0_baa02e2_1202883879567_634876_2995" /><text x="640.0" y="162" font-size="18" fill="#172F45" font-weight="600" text-anchor="middle" data-source-id="_15_0_baa02e2_1202883879567_634876_2995">observatoryContext : ObservatoryContext</text><rect x="102" y="215" width="528" height="474" rx="0" fill="#F7F9FB" stroke="#4F6678" stroke-width="1.5" data-source-id="_16_5_4_359f051f_1260449554968_992972_24991" /><text x="366.0" y="243" font-size="18" fill="#172F45" font-weight="600" text-anchor="middle" data-source-id="_16_5_4_359f051f_1260449554968_992972_24991">ape_t : APE_Telescope</text><rect x="136" y="300" width="349" height="315" rx="0" fill="#FFFFFF" stroke="#4F6678" stroke-width="1.5" data-source-id="_15_0_3c00182_1203339836217_958479_4963" /><text x="310.5" y="328" font-size="18" fill="#172F45" font-weight="600" text-anchor="middle" data-source-id="_15_0_3c00182_1203339836217_958479_4963">omb : OptoMechanicalBench</text><rect x="171" y="478" width="277" height="78" rx="0" fill="#F0F4F7" stroke="#4F6678" stroke-width="1.5" data-source-id="_15_1_baa02e2_1210774914160_880510_12061" /><text x="309.5" y="506" font-size="18" fill="#172F45" font-weight="600" text-anchor="middle" data-source-id="_15_1_baa02e2_1210774914160_880510_12061">lg1 : LensGroup1</text><rect x="793" y="359" width="387" height="242" rx="0" fill="#F7F9FB" stroke="#4F6678" stroke-width="1.5" data-source-id="_15_0_baa02e2_1202884121520_857843_3293" /><text x="986.5" y="387" font-size="18" fill="#172F45" font-weight="600" text-anchor="middle" data-source-id="_15_0_baa02e2_1202884121520_857843_3293">ut3 : UnitTelescope</text><rect x="830" y="472" width="313" height="91" rx="0" fill="#FFFFFF" stroke="#4F6678" stroke-width="1.5" data-source-id="_15_1_baa02e2_1212914157343_515859_8565" /><text x="986.5" y="500" font-size="18" fill="#172F45" font-weight="600" text-anchor="middle" data-source-id="_15_1_baa02e2_1212914157343_515859_8565">ada : NasmythAdapter</text><polyline points="448,517 630,517" fill="none" stroke="#4F6678" stroke-width="1.7" data-source-id="_16_6_1_382e050d_1263291033453_363731_11568" /><polyline points="630,517 830,517" fill="none" stroke="#4F6678" stroke-width="1.7" data-source-id="_16_6_1_382e050d_1263290942250_179892_11452" /><rect x="441" y="510" width="14" height="14" fill="#FFFFFF" stroke="#4F6678" stroke-width="1.5" data-source-id="_15_1_bf10301_1210764986103_615550_6670" /><rect x="623" y="510" width="14" height="14" fill="#FFFFFF" stroke="#4F6678" stroke-width="1.5" data-source-id="_15_1_bf10301_1210680977392_846759_11441" /><rect x="823" y="510" width="14" height="14" fill="#FFFFFF" stroke="#4F6678" stroke-width="1.5" data-source-id="_15_1_baa02e2_1212914971437_912712_9360" /><text x="458" y="505" font-size="16" fill="#172F45" font-weight="400" text-anchor="start" data-source-id="">in_oif</text><text x="542" y="551" font-size="16" fill="#172F45" font-weight="400" text-anchor="start" data-source-id="">object_oif</text><text x="736" y="505" font-size="16" fill="#172F45" font-weight="400" text-anchor="start" data-source-id="">FoV_oif</text><text x="155" y="650" font-size="18" fill="#172F45" font-weight="400" text-anchor="start" data-source-id="">lg1 is reached through the nested path omb.lg1.</text><text x="698" y="277" font-size="18" fill="#172F45" font-weight="400" text-anchor="start" data-source-id="">The English source describes telescope light</text><text x="698" y="302" font-size="18" fill="#172F45" font-weight="400" text-anchor="start" data-source-id="">passing from the Nasmyth adapter into APE.</text><text x="698" y="327" font-size="18" fill="#172F45" font-weight="400" text-anchor="start" data-source-id="">The selected 2023 connectors are undirected.</text><polyline points="52,789 1228,789" fill="none" stroke="#4F6678" stroke-width="1.7" data-source-id="" /><text x="52" y="819" font-size="16" fill="#4F6678" font-weight="400" text-anchor="start" data-source-id="">2023 source: three untyped &lt;&lt;proxy&gt;&gt; ports. Squares omit 2011 Figure 20 port arrow glyphs.</text><text x="52" y="842" font-size="16" fill="#4F6678" font-weight="400" text-anchor="start" data-source-id="">Connectors stay undirected; interface contracts, conjugation and full proxy-port semantics are not translated.</text><text x="52" y="865" font-size="16" fill="#4F6678" font-weight="400" text-anchor="start" data-source-id="">Derived v2 exposes only lg1/ada for nested ends; ut3/ape_t retain private visibility.</text></g><text x="52" y="889" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#4F6678" data-presentation-only="true">Engineering Standard | presentation prototype; identical source semantics and coordinates</text></svg>