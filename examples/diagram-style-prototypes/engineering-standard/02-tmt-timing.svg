<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900"><title>02-tmt-timing</title><desc>New model-derived selected view. Original notation/version, trace IDs and omissions are documented in the matched explanation. Not a native Cameo export.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#4F6678" /></marker></defs><rect width="1280" height="900" fill="#FFFFFF" /><g font-family="Arial, sans-serif"><text x="52" y="48" font-size="28" fill="#172F45" font-weight="600" text-anchor="start" data-source-id="" font-family="Arial, sans-serif">TMT APS | From requirement to a computable timing constraint</text><text x="52" y="82" font-size="17" fill="#4F6678" font-weight="400" text-anchor="start" data-source-id="">Selected source evidence: original 2017 Figures 7-8 + February native model | separate meanings retained</text><polyline points="52,104 1228,104" fill="none" stroke="#4F6678" stroke-width="1.7" data-source-id="" /><rect x="52" y="143" width="548" height="228" rx="0" fill="#F7F9FB" stroke="#4F6678" stroke-width="1.5" data-source-id="_2ca33d85-e793-40fa-9f3a-b3c90e37fd87__17_188f7b22-cc8f-4e5c-b35c-8e3fc63198fb" /><text x="326.0" y="171" font-size="15" fill="#172F45" font-weight="400" text-anchor="middle" data-source-id="">source requirement - English paraphrase</text><text x="326.0" y="195" font-size="18" fill="#172F45" font-weight="600" text-anchor="middle" data-source-id="_2ca33d85-e793-40fa-9f3a-b3c90e37fd87__17_188f7b22-cc8f-4e5c-b35c-8e3fc63198fb">REQ-2-APS-0017</text><polyline points="52,208 600,208" fill="none" stroke="#4F6678" stroke-width="1.7" data-source-id="" /><text x="68" y="238" font-size="17" fill="#172F45" font-weight="400" text-anchor="start" data-source-id="_2ca33d85-e793-40fa-9f3a-b3c90e37fd87__17_188f7b22-cc8f-4e5c-b35c-8e3fc63198fb">APS supports on-axis alignment in less than 30 minutes,</text><text x="68" y="262" font-size="17" fill="#172F45" font-weight="400" text-anchor="start" data-source-id="_2ca33d85-e793-40fa-9f3a-b3c90e37fd87__17_188f7b22-cc8f-4e5c-b35c-8e3fc63198fb">at a single elevation angle, when all optics are within</text><text x="68" y="286" font-size="17" fill="#172F45" font-weight="400" text-anchor="start" data-source-id="_2ca33d85-e793-40fa-9f3a-b3c90e37fd87__17_188f7b22-cc8f-4e5c-b35c-8e3fc63198fb">the alignment maintenance specifications.</text><text x="68" y="310" font-size="17" fill="#172F45" font-weight="400" text-anchor="start" data-source-id="_2ca33d85-e793-40fa-9f3a-b3c90e37fd87__17_188f7b22-cc8f-4e5c-b35c-8e3fc63198fb" /><text x="68" y="334" font-size="17" fill="#172F45" font-weight="400" text-anchor="start" data-source-id="_2ca33d85-e793-40fa-9f3a-b3c90e37fd87__17_188f7b22-cc8f-4e5c-b35c-8e3fc63198fb">Full engineering conditions are retained as prose.</text><rect x="675" y="143" width="553" height="228" rx="0" fill="#F7F9FB" stroke="#4F6678" stroke-width="1.5" data-source-id="_18_0_5_c0402fd_1464026223074_50206_149810" /><text x="951.5" y="171" font-size="15" fill="#172F45" font-weight="400" text-anchor="middle" data-source-id="">original modeled formalization</text><text x="951.5" y="195" font-size="18" fill="#172F45" font-weight="600" text-anchor="middle" data-source-id="_18_0_5_c0402fd_1464026223074_50206_149810">Maintenance Alignment Maximum Time</text><polyline points="675,208 1228,208" fill="none" stroke="#4F6678" stroke-width="1.7" data-source-id="" /><text x="691" y="238" font-size="17" fill="#172F45" font-weight="400" text-anchor="start" data-source-id="_18_0_5_c0402fd_1464026223074_50206_149810">maintenanceAlignmentTimeLimit: default 1800.0 s</text><text x="691" y="262" font-size="17" fill="#172F45" font-weight="400" text-anchor="start" data-source-id="_18_0_5_c0402fd_1464026223074_50206_149810" /><text x="691" y="286" font-size="17" fill="#172F45" font-weight="400" text-anchor="start" data-source-id="_18_0_5_c0402fd_1464026223074_50206_149810">Original class default: February 2017.</text><text x="691" y="310" font-size="17" fill="#172F45" font-weight="400" text-anchor="start" data-source-id="_18_0_5_c0402fd_1464026223074_50206_149810">A timing predicate alone does not verify the optics</text><text x="691" y="334" font-size="17" fill="#172F45" font-weight="400" text-anchor="start" data-source-id="_18_0_5_c0402fd_1464026223074_50206_149810">or elevation-angle conditions.</text><text x="52" y="415" font-size="20" fill="#8A3D10" font-weight="600" text-anchor="start" data-source-id="">Source discrepancy: English uses &lt; 30 min; mathematical model uses &lt;= 1800 s.</text><text x="52" y="442" font-size="20" fill="#8A3D10" font-weight="600" text-anchor="start" data-source-id="">At exactly 1800 s the source constraint passes, while the literal English timing condition does not.</text><rect x="52" y="511" width="360" height="152" rx="0" fill="#F0F4F7" stroke="#4F6678" stroke-width="1.5" data-source-id="_18_0_4_baa02e2_1438808102180_452510_161842" /><text x="232.0" y="539" font-size="18" fill="#172F45" font-weight="600" text-anchor="middle" data-source-id="_18_0_4_baa02e2_1438808102180_452510_161842">peas : PEAS</text><polyline points="52,552 412,552" fill="none" stroke="#4F6678" stroke-width="1.7" data-source-id="" /><text x="68" y="582" font-size="17" fill="#172F45" font-weight="400" text-anchor="start" data-source-id="_18_0_4_baa02e2_1438808102180_452510_161842">tFinal : Real [seconds]</text><text x="68" y="606" font-size="17" fill="#172F45" font-weight="400" text-anchor="start" data-source-id="_18_0_4_baa02e2_1438808102180_452510_161842">Maintenance effect:</text><text x="68" y="630" font-size="17" fill="#172F45" font-weight="400" text-anchor="start" data-source-id="_18_0_4_baa02e2_1438808102180_452510_161842">tFinal = t1 - t0.</text><rect x="677" y="518" width="551" height="190" rx="0" fill="#F0F4F7" stroke="#4F6678" stroke-width="1.5" data-source-id="_18_0_2_baa02e2_1429562376319_87817_151513" /><text x="952.5" y="546" font-size="15" fill="#172F45" font-weight="400" text-anchor="middle" data-source-id="">&lt;&lt;constraint&gt;&gt;</text><text x="952.5" y="570" font-size="18" fill="#172F45" font-weight="600" text-anchor="middle" data-source-id="_18_0_2_baa02e2_1429562376319_87817_151513">maintenanceAlignment : MaxTimeConstraint</text><polyline points="677,583 1228,583" fill="none" stroke="#4F6678" stroke-width="1.7" data-source-id="" /><text x="693" y="613" font-size="17" fill="#172F45" font-weight="400" text-anchor="start" data-source-id="_18_0_2_baa02e2_1429562376319_87817_151513">p1 : Real [seconds]</text><text x="693" y="637" font-size="17" fill="#172F45" font-weight="400" text-anchor="start" data-source-id="_18_0_2_baa02e2_1429562376319_87817_151513">maxTime : Real [seconds]</text><text x="693" y="661" font-size="17" fill="#172F45" font-weight="400" text-anchor="start" data-source-id="_18_0_2_baa02e2_1429562376319_87817_151513" /><text x="693" y="685" font-size="17" fill="#172F45" font-weight="400" text-anchor="start" data-source-id="_18_0_2_baa02e2_1429562376319_87817_151513">p1 &lt;= maxTime</text><polyline points="412,555 677,555" fill="none" stroke="#4F6678" stroke-width="1.7" data-source-id="_18_0_5_c0402fd_1464026509327_174724_150238" /><text x="511" y="541" font-size="16" fill="#172F45" font-weight="400" text-anchor="start" data-source-id="_18_0_5_c0402fd_1464026509327_174724_150238">=  p1</text><polyline points="1228,275 1250,275 1250,756 1000,756 1000,708" fill="none" stroke="#4F6678" stroke-width="1.7" data-source-id="_18_0_5_c0402fd_1464026223152_177814_149832" /><text x="1060" y="778" font-size="16" fill="#172F45" font-weight="400" text-anchor="start" data-source-id="_18_0_5_c0402fd_1464026223152_177814_149832">=  maxTime</text><text x="52" y="707" font-size="17" fill="#172F45" font-weight="400" text-anchor="start" data-source-id="">Bindings equate values; these lines are not directional data transfers.</text><text x="52" y="731" font-size="17" fill="#172F45" font-weight="400" text-anchor="start" data-source-id="">1560 s (paper-reported 26 min) meets both timing boundaries. No simulation was replayed.</text><polyline points="52,789 1228,789" fill="none" stroke="#4F6678" stroke-width="1.7" data-source-id="" /><text x="52" y="819" font-size="16" fill="#4F6678" font-weight="400" text-anchor="start" data-source-id="">English-to-formalization association is documented by paper Figure 7; exact publication export is unverified.</text><text x="52" y="842" font-size="16" fill="#4F6678" font-weight="400" text-anchor="start" data-source-id="">Scalar boundary checks preserve &lt;=. They do not establish full REQ-2-APS-0017 satisfaction or acceptance.</text><text x="52" y="865" font-size="16" fill="#4F6678" font-weight="400" text-anchor="start" data-source-id="">New model-derived schematic; derived SysML v2 model is separately parser-validated. Original figures are linked.</text></g><text x="52" y="889" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#4F6678" data-presentation-only="true">Engineering Standard | presentation prototype; identical source semantics and coordinates</text></svg>