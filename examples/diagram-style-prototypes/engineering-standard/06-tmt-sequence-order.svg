-sort="asynchSignal" /><text x="485" y="549" font-family="Arial, sans-serif" font-size="21" fill="#172F45" data-source-id="_18_0_4_baa02e2_1435196367610_837152_180594">Abort</text><circle cx="330" cy="565" r="0" data-source-id="_18_0_5_baa02e2_1458099294147_588842_152092" /><circle cx="960" cy="565" r="0" data-source-id="_18_0_5_baa02e2_1458099294147_466084_152093" /><text x="52" y="745" font-family="Arial, sans-serif" font-size="19" fill="#172F45">Reading: analysisDriver sends Abort, then Maintenance Alignment, then Abort to peas.</text><text x="52" y="780" font-family="Arial, sans-serif" font-size="18" fill="#172F45">Source message sort: asynchSignal. Event order is local to each lifeline.</text><text x="52" y="815" font-family="Arial, sans-serif" font-size="18" fill="#172F45">Duration records retained in source XML; 60s/2000s are not invented exact timers here.</text><text x="52" y="850" font-family="Arial, sans-serif" font-size="17" fill="#172F45">Selected v2 message-order transcription; full timed scenario and simulation remain unverified.</text><text x="52" y="889" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#4F6678" data-presentation-only="true">Engineering Standard | presentation prototype; identical source semantics and coordinates</text></svg>