<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc"><title id="title">TMT maintenance analysis: selected message order</title><desc id="desc">analysisDriver sends asynchronous Abort, Maintenance Alignment and Abort signals to peas in that order. Three messages and six event endpoints retained. Source duration constraints are retained in XML but not transcribed into timed assertions.</desc><rect width="1280" height="900" fill="#FFFFFF" /><defs><marker id="async" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11" stroke="#172F45" stroke-width="2" fill="none" /></marker></defs><text x="52" y="48" font-family="Arial, sans-serif" font-size="28" fill="#172F45">Maintenance analysis | selected signal exchange order</text><text x="52" y="81" font-family="Arial, sans-serif" font-size="18" fill="#172F45">TMT APS | simplified SysML1.4 Sequence reading | timing not transcribed</text><line x1="52" x2="1228" y1="105" y2="105" stroke="#4F6678" /><rect x="190" y="180" width="280" height="80" fill="#F0F4F7" stroke="#172F45" stroke-width="2" data-source-id="_18_0_5_baa02e2_1458099294143_628657_152079" /><text x="230" y="228" font-family="Arial, sans-serif" font-size="22" fill="#172F45" data-source-id="_18_0_5_baa02e2_1454128060627_462855_170075">analysisDriver</text><line x1="330" x2="330" y1="260" y2="690" stroke="#4F6678" stroke-dasharray="9 7" data-source-id="_18_0_5_baa02e2_1458099294143_628657_152079" /><rect x="820" y="180" width="280" height="80" fill="#F0F4F7" stroke="#172F45" stroke-width="2" data-source-id="_18_0_5_baa02e2_1458099294144_32845_152081" /><text x="860" y="228" font-family="Arial, sans-serif" font-size="22" fill="#172F45" data-source-id="_17_0_2_3_41e01aa_1389728908413_724070_61695">peas</text><line x1="960" x2="960" y1="260" y2="690" stroke="#4F6678" stroke-dasharray="9 7" data-source-id="_18_0_5_baa02e2_145809929