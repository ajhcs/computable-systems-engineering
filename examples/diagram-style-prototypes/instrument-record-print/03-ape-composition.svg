ta-source-id="_16_6_1_38390512_1265838951058_526030_71009">Mount</text><polyline points="991,279 991,426" fill="none" stroke="#434A47" stroke-width="1.7" data-source-id="_16_6_1_38390512_1265838967762_750737_71036" /><polygon points="991,279 986,288 991,297 996,288" fill="#434A47" /><text x="1006" y="400" font-size="16" fill="#171918" font-weight="400" text-anchor="start" data-source-id="_16_6_1_38390512_1265838967762_750737_71036">[1] (implicit)</text><text x="834" y="604" font-size="16" fill="#171918" font-weight="400" text-anchor="start" data-source-id="">Source Mount role is unnamed.</text><text x="834" y="627" font-size="16" fill="#171918" font-weight="400" text-anchor="start" data-source-id="">Only derived v2 names it mount.</text><text x="132" y="664" font-size="20" fill="#171918" font-weight="400" text-anchor="start" data-source-id="">The Cookbook explains three actuators per segment: 61 x 3 = 183.</text><text x="132" y="691" font-size="20" fill="#171918" font-weight="400" text-anchor="start" data-source-id="">The selected formal model composes all 183 actuators directly under the mirror.</text><text x="132" y="718" font-size="20" fill="#171918" font-weight="400" text-anchor="start" data-source-id="">No actuator-to-individual-segment allocation is added by this simplification.</text><polyline points="52,789 1228,789" fill="none" stroke="#434A47" stroke-width="1.7" data-source-id="" /><text x="52" y="819" font-size="16" fill="#434A47" font-weight="400" text-anchor="start" data-source-id="">Real APE instrument; professionally reverse-engineered and simplified MBSE reference, not an as-built model.</text><text x="52" y="842" font-size="16" fill="#434A47" font-weight="400" text-anchor="start" data-source-id="">Cookbook section 5.3.5 / Figure 10 (2011) and pinned model (2023): traced match, not an identical export.</text><text x="52" y="865" font-size="16" fill="#434A47" font-weight="400" text-anchor="start" data-source-id="">New layout omits source photographs and quantitative values; Apache-2.0 model notices preserved.</text></g><text x="52" y="889" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#434A47" data-presentation-only="true">Instrument Record / designed light print variant | presentation prototype; identical source semantics and coordinates</text></svg>