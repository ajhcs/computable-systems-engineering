9" fill="none" stroke="#A8B5AA" stroke-width="1.7" data-source-id="" /><text x="52" y="819" font-size="16" fill="#CBD6CE" font-weight="400" text-anchor="start" data-source-id="">Abort exits the composite state; Finished on a phasing state advances that state. They are different events.</text><text x="52" y="842" font-size="16" fill="#CBD6CE" font-weight="400" text-anchor="start" data-source-id="">Original Figure 2 / section 2.3 linked in the reference. New layout; actions retained as opaque specifications.</text><text x="52" y="865" font-size="16" fill="#CBD6CE" font-weight="400" text-anchor="start" data-source-id="">Herzig et al. (2017), JPL/Caltech, TMT and No Magic. Native simulation and graphical conformance untested.</text></g><text x="52" y="889" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#CBD6CE" data-presentation-only="true">Instrument Record | presentation prototype; identical source semantics and coordinates</text></svg>